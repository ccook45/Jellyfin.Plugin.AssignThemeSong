name: Jellyfin 12 build and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Jellyfin.Plugin.AssignThemeSong.csproj --configuration Release

      - name: Package
        shell: bash
        run: |
          rm -rf package
          mkdir package
          cp -a bin/Release/net10.0/. package/
          cd package
          zip -r ../xThemeSong_v1.4.5.zip .

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.4.5 >/dev/null 2>&1; then
            gh release upload v1.4.5 xThemeSong_v1.4.5.zip --clobber
          else
            gh release create v1.4.5 xThemeSong_v1.4.5.zip --title "xThemeSong 1.4.5 - Jellyfin 12" --notes "Jellyfin 12 compatibility release. Built against Jellyfin 12.0.0 / .NET 10."
          fi

      - name: Update manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          asset = Path("xThemeSong_v1.4.5.zip")
          checksum = hashlib.md5(asset.read_bytes()).hexdigest().upper()
          path = Path("manifest.json")
          data = json.loads(path.read_text(encoding="utf-8-sig"))

          entry = {
              "version": "1.4.5.0",
              "checksum": checksum,
              "changelog": "v1.4.5: Jellyfin 12 compatibility; migrated to .NET 10 and Jellyfin 12.0 APIs.",
              "targetAbi": "12.0.0.0",
              "sourceUrl": "https://github.com/ccook45/Jellyfin.Plugin.AssignThemeSong/releases/download/v1.4.5/xThemeSong_v1.4.5.zip"
          }

          for plugin in data:
              plugin["owner"] = "ccook45"
              versions = plugin.setdefault("versions", [])
              versions[:] = [v for v in versions if v.get("version") != "1.4.5.0"]
              versions.insert(0, entry)

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Manifest checksum: {checksum}")
          PY

      - name: Commit manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Jellyfin 12 manifest"
            git push
          fi
